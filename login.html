<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login – QNu Labs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>:root{
  --bg:#F5F0E8;--surface:#FFFFFF;--surface2:#FAF7F2;
  --border:#E8DDD0;--border2:#D9CCBA;
  --text:#1A1A1A;--muted:#7A6E63;
  --accent:#E8450A;--accent-light:#FDF0EB;--accent-border:#F5C4B0;
  --green:#1A7A4A;--green-light:#EBF7F1;--green-border:#A8DFC1;
  --yellow:#B87A00;--yellow-light:#FDF8EB;--yellow-border:#EDD98A;
  --purple:#7A3AAA;--purple-light:#F0EBF7;--purple-border:#D4B8EE;
  --blue:#1A5FAA;--blue-light:#EBF3FF;--blue-border:#B8D4F5;
  --shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06);}
.topbar-left{display:flex;align-items:center;gap:16px;}
.logo{height:36px;width:auto;object-fit:contain;}
.divider-v{width:1px;height:28px;background:var(--border2);}
.topbar-title span:first-child{display:block;font-size:13px;font-weight:700;}
.topbar-title span:last-child{display:block;font-size:11px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.role-badge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;}
.role-badge.writer{background:var(--accent-light);border:1px solid var(--accent-border);color:var(--accent);}
.role-badge.seo{background:var(--yellow-light);border:1px solid var(--yellow-border);color:var(--yellow);}
.role-badge.cmo{background:var(--purple-light);border:1px solid var(--purple-border);color:var(--purple);}
.role-badge.designer{background:var(--blue-light);border:1px solid var(--blue-border);color:var(--blue);}
.live-badge{display:flex;align-items:center;gap:6px;background:var(--green-light);border:1px solid var(--green-border);color:var(--green);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.last-updated{font-size:11px;color:var(--muted);}
.refresh-btn,.home-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;text-decoration:none;transition:background 0.15s;display:inline-flex;align-items:center;gap:6px;}
.refresh-btn:hover,.home-btn:hover{background:var(--border);}
.home-btn{color:var(--muted);}
.main{max-width:1100px;margin:0 auto;padding:36px 24px;}
.page-header{margin-bottom:28px;}
.page-header h2{font-size:22px;font-weight:700;letter-spacing:-0.4px;margin-bottom:4px;}
.page-header p{color:var(--muted);font-size:13px;}
.stats-row{display:grid;gap:12px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:transform 0.15s;}
.stat-card:hover{transform:translateY(-2px);}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;}
.stat-value{font-size:32px;font-weight:700;}
.stat-card.s-accent .stat-value{color:var(--accent);}
.stat-card.s-green .stat-value{color:var(--green);}
.stat-card.s-yellow .stat-value{color:var(--yellow);}
.stat-card.s-purple .stat-value{color:var(--purple);}
.stat-card.s-blue .stat-value{color:var(--blue);}
.stat-card.s-total .stat-value{color:var(--text);}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:15px;font-weight:700;}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all 0.15s;font-family:'Inter',sans-serif;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border);}
th{padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
td{padding:13px 16px;font-size:13px;vertical-align:middle;}
.preview-cell{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
.num-cell{color:var(--muted);font-size:12px;width:40px;}
.date-cell{color:var(--muted);font-size:11px;white-space:nowrap;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-dot{width:5px;height:5px;border-radius:50%;}
.badge.draft{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.badge.draft .badge-dot{background:var(--muted);}
.badge.submitted{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-border);}
.badge.submitted .badge-dot{background:var(--accent);}
.badge.with-seo{background:var(--yellow-light);color:var(--yellow);border:1px solid var(--yellow-border);}
.badge.with-seo .badge-dot{background:var(--yellow);}
.badge.with-cmo{background:var(--purple-light);color:var(--purple);border:1px solid var(--purple-border);}
.badge.with-cmo .badge-dot{background:var(--purple);}
.badge.with-designer{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-border);}
.badge.with-designer .badge-dot{background:var(--blue);}
.badge.ready{background:var(--green-light);color:var(--green);border:1px solid var(--green-border);}
.badge.ready .badge-dot{background:var(--green);}
.badge.posted{background:#1A1A1A;color:#fff;}
.badge.posted .badge-dot{background:#fff;}
.type-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.type-pill.blog{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-border);}
.type-pill.whitepaper{background:var(--purple-light);color:var(--purple);border:1px solid var(--purple-border);}
.type-pill.newsletter{background:var(--green-light);color:var(--green);border:1px solid var(--green-border);}
.type-pill.other{background:var(--yellow-light);color:var(--yellow);border:1px solid var(--yellow-border);}
.toggle{position:relative;width:42px;height:24px;cursor:pointer;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;border-radius:24px;background:var(--border2);transition:0.2s;}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:2px;top:2px;transition:0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.2);}
.toggle input:checked + .toggle-slider{background:var(--accent);}
.toggle input:checked + .toggle-slider::before{transform:translateX(18px);}
.toggle.seo input:checked + .toggle-slider{background:var(--yellow);}
.toggle.cmo input:checked + .toggle-slider{background:var(--purple);}
.toggle.designer input:checked + .toggle-slider{background:var(--blue);}
.toggle.saving{opacity:0.4;pointer-events:none;}
.toggle-wrap{display:flex;align-items:center;gap:8px;}
.toggle-label{font-size:12px;color:var(--muted);font-weight:500;}
.fs-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;animation:fsIn 0.2s ease;}
.fs-overlay.show{display:block;}
@keyframes fsIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fs-topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.fs-topbar-left{display:flex;align-items:center;gap:16px;}
.fs-title{font-size:16px;font-weight:700;letter-spacing:-0.3px;}
.fs-subtitle{font-size:12px;color:var(--muted);margin-top:2px;}
.fs-back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;display:flex;align-items:center;gap:6px;transition:background 0.15s;}
.fs-back-btn:hover{background:var(--border);}
.fs-body{max-width:1300px;margin:0 auto;padding:32px 40px;}
.fs-meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.fs-meta-item{display:flex;flex-direction:column;gap:4px;}
.fs-meta-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
.fs-meta-value{font-size:14px;font-weight:600;}
.fs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px;}
.fs-card-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.fs-section-title{font-size:14px;font-weight:700;color:var(--text);padding:12px 0 8px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-group{display:flex;flex-direction:column;gap:6px;}
.field-group.full{grid-column:1/-1;}
.field-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;display:flex;align-items:center;gap:4px;}
.field-label .req{color:var(--accent);font-size:13px;}
.field-input,.field-textarea,.field-select,.field-date{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);outline:none;width:100%;transition:border 0.15s,background 0.15s;}
.field-input:focus,.field-textarea:focus,.field-date:focus{border-color:var(--accent);background:#fff;}
.field-textarea{min-height:100px;resize:vertical;line-height:1.6;}
.field-richtext-wrap{border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
.field-richtext-wrap:focus-within{border-color:var(--accent);}
.richtext-toolbar{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:4px;flex-wrap:wrap;}
.rt-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;color:var(--text);transition:all 0.15s;font-weight:500;}
.rt-btn:hover{background:var(--border);}
.rt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.richtext-editor{min-height:200px;padding:14px;font-size:14px;line-height:1.75;outline:none;color:var(--text);}
.richtext-editor:empty:before{content:attr(data-placeholder);color:var(--muted);pointer-events:none;}
.richtext-editor h2{font-size:18px;font-weight:700;margin:12px 0 6px;}
.richtext-editor ul{padding-left:20px;margin:6px 0;}
.richtext-editor ol{padding-left:20px;margin:6px 0;}
.richtext-editor p{margin:4px 0;}
.faq-section{margin-top:4px;}
.faq-pair{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px;padding:14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);}
.faq-pair-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:border 0.15s,background 0.15s;}
.upload-area:hover{border-color:var(--accent);background:var(--accent-light);}
.upload-area input[type=file]{display:none;}
.upload-area-label{font-size:13px;color:var(--muted);}
.upload-area-label span{color:var(--accent);font-weight:600;}
.img-preview-fs{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;}
.img-preview-fs.show{display:block;}
.img-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.action-btn{border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity 0.15s;display:inline-flex;align-items:center;gap:6px;}
.action-btn:hover{opacity:0.88;}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}
.action-btn.primary{background:var(--accent);color:#fff;}
.action-btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.action-btn.yellow{background:var(--yellow);color:#fff;}
.action-btn.purple{background:var(--purple);color:#fff;}
.action-btn.blue{background:var(--blue);color:#fff;}
.action-btn.green{background:var(--green);color:#fff;}
.approve-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-top:20px;}
.approve-inner{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:16px 20px;flex-wrap:wrap;gap:12px;}
.approve-inner.accent{background:var(--accent-light);border:1px solid var(--accent-border);}
.approve-inner.yellow{background:var(--yellow-light);border:1px solid var(--yellow-border);}
.approve-inner.purple{background:var(--purple-light);border:1px solid var(--purple-border);}
.approve-inner.blue{background:var(--blue-light);border:1px solid var(--blue-border);}
.approve-label{font-size:14px;font-weight:700;}
.approve-label.accent{color:var(--accent);}
.approve-label.yellow{color:var(--yellow);}
.approve-label.purple{color:var(--purple);}
.approve-label.blue{color:var(--blue);}
.approve-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.publish-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;}
.publish-opt{border:3px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.15s;background:#fff;}
.publish-opt:hover{border-color:var(--blue);}
.publish-opt.selected-draft{border-color:var(--blue);background:var(--blue-light);}
.publish-opt.selected-live{border-color:var(--green);background:var(--green-light);}
.publish-opt-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.publish-opt-sub{font-size:12px;color:var(--muted);}
.webflow-btn{background:var(--blue);color:#fff;border:none;padding:13px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;width:100%;margin-top:14px;transition:opacity 0.15s;}
.webflow-btn:hover{opacity:0.88;}
.webflow-btn:disabled{opacity:0.4;cursor:not-allowed;}
.post-result{margin-top:10px;font-size:13px;font-weight:600;text-align:center;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:13px 18px;border-radius:12px;font-size:13px;z-index:9999;transform:translateY(80px);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);font-weight:500;max-width:360px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:var(--green-border);}
.toast.error{border-color:var(--accent-border);}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.toast.error .toast-dot{background:var(--accent);}
.empty-state{text-align:center;padding:56px 24px;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--muted);}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--muted);font-size:13px;}
.save-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
@media(max-width:900px){
  .field-grid{grid-template-columns:1fr;}
  .publish-options{grid-template-columns:1fr;}
  .fs-topbar,.topbar{padding:0 16px;}
  .fs-body,.main{padding:20px 16px;}
}

body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);}
.login-logo{height:48px;display:block;margin:0 auto 28px;}
.login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:-0.3px;}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:32px;}
.login-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
.login-input{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);outline:none;width:100%;transition:border 0.15s;}
.login-input:focus{border-color:var(--accent);background:#fff;}
.login-btn{background:var(--accent);color:#fff;border:none;padding:13px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;width:100%;margin-top:8px;transition:opacity 0.15s;}
.login-btn:hover{opacity:0.88;}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;}
.login-error{background:#FDF0EB;border:1px solid var(--accent-border);color:var(--accent);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;display:none;}
.login-error.show{display:block;}
</style>
</head>
<body>
<div class="login-card">
  <img class="login-logo" src="logo.png" alt="QNu Labs"/>
  <div class="login-title">Content Approval System</div>
  <div class="login-sub">QNu Labs — Corporate Marketing</div>
  <div class="login-group">
    <label class="login-label">Email Address</label>
    <input class="login-input" type="email" id="email" placeholder="your@qnulabs.com" autocomplete="email"/>
  </div>
  <div class="login-group">
    <label class="login-label">Password</label>
    <input class="login-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
  </div>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
  <div class="login-error" id="loginError"></div>
</div>
<script>
const SUPA_URL='https://imtoahbuliuywiljxvpg.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdG9haGJ1bGl1eXdpbGp4dnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjU5NjIsImV4cCI6MjEwNTgwMTk2Mn0.xQAsTj5JWRScHpAflWc42X7LzU6LiZZVD6nu47u9Bxo';

// If already logged in redirect
async function checkSession(){
  const session=localStorage.getItem('qnu_session');
  if(!session) return;
  try{
    const s=JSON.parse(session);
    if(s.expires_at&&Date.now()/1000>s.expires_at){localStorage.removeItem('qnu_session');return;}
    redirectByRole(s.role);
  }catch(_){localStorage.removeItem('qnu_session');}
}

function redirectByRole(role){
  const map={writer:'writer.html',seo:'seo.html',cmo:'cmo.html',designer:'designer.html',admin:'index.html'};
  window.location.href=map[role]||'login.html';
}

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginError');
  err.classList.remove('show');
  if(!email||!password){err.textContent='Please enter email and password.';err.classList.add('show');return;}
  btn.disabled=true; btn.textContent='Signing in...';
  try{
    // Sign in with Supabase Auth
    const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data=await res.json();
    if(data.error||!data.access_token){
      err.textContent=data.error_description||data.msg||'Invalid email or password.';
      err.classList.add('show'); btn.disabled=false; btn.textContent='Sign In'; return;
    }
    // Get user profile to determine role
    const profRes=await fetch(SUPA_URL+'/rest/v1/user_profiles?id=eq.'+data.user.id+'&select=*',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+data.access_token}
    });
    const profiles=await profRes.json();
    if(!profiles.length){
      err.textContent='Your account has no role assigned. Contact admin.';
      err.classList.add('show'); btn.disabled=false; btn.textContent='Sign In'; return;
    }
    const profile=profiles[0];
    // Save session
    localStorage.setItem('qnu_session',JSON.stringify({
      user_id:data.user.id,
      email:data.user.email,
      access_token:data.access_token,
      refresh_token:data.refresh_token,
      expires_at:data.expires_at,
      role:profile.role,
      full_name:profile.full_name
    }));
    // Log login activity
    await fetch(SUPA_URL+'/rest/v1/activity_log',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+data.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({user_id:data.user.id,user_email:data.user.email,user_role:profile.role,action:'login',details:'User logged in'})
    });
    // Update last_login
    await fetch(SUPA_URL+'/rest/v1/user_profiles?id=eq.'+data.user.id,{
      method:'PATCH',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+data.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({last_login:new Date().toISOString()})
    });
    redirectByRole(profile.role);
  }catch(e){
    err.textContent='Connection error. Please try again.';
    err.classList.add('show'); btn.disabled=false; btn.textContent='Sign In';
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
checkSession();
</script>
</body></html>
